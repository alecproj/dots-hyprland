# -----------------------------------------------------------------------------
# Terminal and server behavior
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",foot:RGB"
set -as terminal-features ",kitty:RGB"

set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -sg escape-time 10
set -g status-interval 5

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -----------------------------------------------------------------------------
# Prefix and navigation
# -----------------------------------------------------------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind c new-window -c "#{pane_current_path}"
unbind-key '"'
unbind-key '%'
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '|' split-window -h -c "#{pane_current_path}"

bind r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"
bind s choose-tree -sZ -O name

# -----------------------------------------------------------------------------
# Copy mode and Wayland clipboard
# -----------------------------------------------------------------------------

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key P run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# -----------------------------------------------------------------------------
# Plugin settings
# -----------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-pain-control"
set -g @plugin "jaclu/tmux-menus"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-sessionist"

set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-dir "~/.local/state/tmux/resurrect"

set -g @menus_trigger "Space"
set -g @menus_config_file "~/.config/tmux/tmux.conf"
set -g @menus_show_key_hints "Yes"

# -----------------------------------------------------------------------------
# Catppuccin
# -----------------------------------------------------------------------------

set -g status-position top
set -g @catppuccin_flavor "macchiato"

set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"
set -g @catppuccin_status_background "none"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M"

run "~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TPM last.
run "~/.config/tmux/plugins/tpm/tpm"
